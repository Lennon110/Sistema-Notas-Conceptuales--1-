server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas de la aplicación de página única (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché óptimo para los recursos estáticos generados por Vite (js, css, etc.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
}

